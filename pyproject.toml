[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wellington-events-scrapper"
version = "0.1.0"
description = "Scrapes Wellington events from many sources, classifies them, and publishes events.json for the companion iOS app."
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools]
# The code runs from the repo root (see README) and is not packaged/distributed.
# This file exists so tools (PyCharm, pip, uv) know the required Python version,
# the dependencies, and the formatter config.
#
# Post-install step (not auto-run by pip/setuptools — run it manually or in CI
# after `pip install -r requirements.txt`):
#     playwright install chromium
packages = []

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.black]
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# Third-party deps (playwright, sklearn, keras, tensorflow, pygad, bs4, …) ship no
# type stubs; silence the unresolved-import noise and check our own code.
ignore_missing_imports = true
